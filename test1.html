<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Zoom on Hover</title>
    <style>
        .zoom-container {
            position: relative;
            overflow: hidden;
            width: 300px;
            height: 200px;
        }
        .zoom-container img {
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
        }
        .zoom-container:hover img {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="zoom-container">
        <img src="image.jpg" alt="示例圖片">
    </div>
</body>
</html>
