<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Zoom on Hover</title>
    <style>
        .zoom-text {
            font-size: 20px;
            transition: font-size 0.5s ease;
        }
        .zoom-text:hover {
            font-size: 30px;
        }
    </style>
</head>
<body>
    <p class="zoom-text">當滑鼠移至此文字上方時，文字會放大。</p>
</body>
</html>
